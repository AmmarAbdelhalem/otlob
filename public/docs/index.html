<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otlob Auto Parts Marketplace — Interactive API Documentation</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!-- Swagger UI CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --border-color: #1f2937;
            --text-primary: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-glow: rgba(37, 99, 235, 0.2);
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .top-navbar {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.85rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-badge {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 0.35rem 0.65rem;
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-sub {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            margin-left: 0.25rem;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 0.9rem;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border-color);
            color: #d1d5db;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #374151;
            color: white;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Swagger UI Custom Overrides */
        .swagger-ui {
            font-family: inherit;
            color: #e5e7eb;
        }

        .swagger-ui .topbar {
            display: none !important;
        }

        .swagger-ui .info {
            margin: 2rem 0;
            padding: 1.5rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .swagger-ui .info .title {
            color: #f9fafb !important;
            font-family: inherit;
            font-weight: 800;
            font-size: 2rem;
        }

        .swagger-ui .info p, .swagger-ui .info li, .swagger-ui .info table {
            color: #9ca3af !important;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .swagger-ui .scheme-container {
            background: var(--bg-secondary) !important;
            border-bottom: 1px solid var(--border-color);
            box-shadow: none;
            padding: 1.25rem 0;
        }

        .swagger-ui select {
            background-color: #1f2937 !important;
            color: #f9fafb !important;
            border-color: #374151 !important;
            border-radius: 6px;
        }

        .swagger-ui .btn.authorize {
            background-color: #2563eb !important;
            border-color: #2563eb !important;
            color: white !important;
            border-radius: 8px;
            font-weight: 600;
        }

        .swagger-ui .btn.authorize svg {
            fill: white;
        }

        .swagger-ui .opblock-tag {
            color: #f3f4f6 !important;
            border-bottom: 1px solid #1f2937 !important;
            font-family: inherit;
            font-size: 1.3rem;
        }

        .swagger-ui .opblock {
            border-radius: 10px !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            margin: 0 0 1rem;
        }

        .swagger-ui .opblock .opblock-summary-method {
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .swagger-ui .opblock .opblock-summary-path {
            color: #f9fafb !important;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .swagger-ui .opblock .opblock-summary-description {
            color: #9ca3af !important;
            font-size: 0.85rem;
        }

        .swagger-ui .opblock-body {
            background: #111827 !important;
        }

        .swagger-ui table.parameters, .swagger-ui table.responses-table {
            color: #e5e7eb;
        }

        .swagger-ui table thead tr th {
            color: #9ca3af;
            border-bottom: 1px solid #374151;
        }

        .swagger-ui .parameter__name {
            color: #60a5fa;
            font-family: 'JetBrains Mono', monospace;
        }

        .swagger-ui .parameter__type {
            color: #9ca3af;
        }

        .swagger-ui input[type=text], .swagger-ui textarea {
            background: #1f2937 !important;
            border: 1px solid #374151 !important;
            color: #f9fafb !important;
            border-radius: 6px;
        }

        .swagger-ui .response-col_status {
            color: #34d399;
            font-weight: 700;
        }

        .swagger-ui .responses-inner {
            background: #0f172a;
        }

        .swagger-ui .model-box {
            background: #1e293b;
        }

        .swagger-ui .model {
            color: #e2e8f0;
        }

        .swagger-ui section.models {
            border: 1px solid #1f2937;
            border-radius: 12px;
            background: #111827;
        }

        .swagger-ui section.models h4 {
            color: #f3f4f6;
        }

        .swagger-container {
            max-width: 1360px;
            margin: 0 auto;
            padding: 1.5rem;
        }
    </style>
</head>
<body>
    <header class="top-navbar">
        <a href="/" class="brand">
            <span class="brand-badge">OTLOB</span>
            <span class="brand-title">Auto Parts API</span>
            <span class="brand-sub">v1.0 (Headless Backend)</span>
        </a>

        <div class="nav-actions">
            <div class="status-pill">
                <span class="status-dot"></span>
                <span>Operational</span>
            </div>

            <a href="/docs/openapi.json" target="_blank" download="openapi.json" class="btn btn-outline" title="Download raw OpenAPI 3.1 JSON Specification">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>OpenAPI JSON</span>
            </a>

            <a href="/docs/otlob_postman_collection.json" target="_blank" download="otlob_postman_collection.json" class="btn btn-primary" title="Download Postman Collection v2.1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>
                <span>Postman Collection</span>
            </a>
        </div>
    </header>

    <main class="swagger-container">
        <div id="swagger-ui"></div>
    </main>

    <!-- Swagger UI Bundle JS -->
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
        window.onload = function() {
            window.ui = SwaggerUIBundle({
                url: "/docs/openapi.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "BaseLayout",
                persistAuthorization: true,
                displayRequestDuration: true,
                docExpansion: "list",
                filter: true,
                showExtensions: true,
                showCommonExtensions: true,
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 2,
                tryItOutEnabled: true
            });
        };
    </script>
</body>
</html>
