# Otlob Auto Parts Delivery Platform — Production Redis Configuration
# Optimized for geospatial courier tracking, atomic distributed locks, and persistent job queues.

port 6379
bind 0.0.0.0
protected-mode yes

# Memory Management
# CRITICAL: Prevent eviction of financial locks, active queue states, and pending delivery coordinates
maxmemory 2gb
maxmemory-policy noeviction

# Persistence (AOF & RDB snapshotting)
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Performance & Latency
tcp-backlog 511
timeout 0
tcp-keepalive 300
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 128
